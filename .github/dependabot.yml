version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/api'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'npm'
    directory: '/dashboard'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) breaks vue-tsc; revisit when vue-tsc supports it.
      - dependency-name: 'typescript'
        versions: ['7.x']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'docker'
    directories:
      - '/api'
      - '/dashboard'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
