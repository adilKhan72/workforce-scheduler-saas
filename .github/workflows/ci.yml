name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Laravel, PostgreSQL 18)
    runs-on: ubuntu-latest
    # Row-level security is PostgreSQL-only, so CI never uses the SQLite default from phpunit.xml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scheduler_test
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduler" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: scheduler_test
      DB_USERNAME: scheduler
      DB_PASSWORD: scheduler
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests (RLS suite must not be skipped here)
        run: php artisan test --display-skipped 2>&1 | tee test-output.txt; test ${PIPESTATUS[0]} -eq 0 && ! grep -qE "Tests:.*skipped" test-output.txt
        shell: bash

  dashboard:
    name: dashboard (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type-check (vue-tsc) and build
        run: npm run build

  compose:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
        env:
          APP_KEY: base64:ci-only-not-a-secret
      - run: docker compose build
        env:
          APP_KEY: base64:ci-only-not-a-secret
