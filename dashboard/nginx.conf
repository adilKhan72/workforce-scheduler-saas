server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: no CORS, and the bearer token never goes to another host.
  location /graphql { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /api/    { proxy_pass http://api:8000; proxy_set_header Host $host; }

  # SPA fallback.
  location / { try_files $uri /index.html; }
}
